<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="version" content="__SUB_STORE_FRONT_END_VERSION__">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" /> -->
  <meta http-equiv="Expires" content="0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sub-Store</title>
  <meta name="description" content="A sub-converter running in a Progressive Web App" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="mask-icon" href="/favicon.svg" color="#FFFFFF" />
  <meta id="theme__color" name="theme-color" content="#000" />
  <link rel="manifest" href="/manifests.json" />
  <style>
    html {
      width: 100%;
      height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      background: #f2f3f6;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0b0c0e;
      }
    }

    /*
     * Placeholder shown until the app starts, laid out like the subscription
     * list. The app replaces it on mount, and Sub.vue shows the same list
     * placeholder until the subscriptions arrive. Theme variables apply once
     * the app has set them; the fallbacks match the default black / white / grey themes
     * (src/themes/light.ts, dark.ts) so nothing changes when they do.
     */
    :root {
      --skeleton-nav: #f2f3f6d9;
      --skeleton-tab: #ffffffb3;
      --skeleton-card: #ffffff;
      --skeleton-stroke: #10141c0f;
      --skeleton-divider: #10141c14;
      --skeleton-line: #10141c0d;
      --skeleton-shine: #10141c06;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --skeleton-nav: #0b0c0ed9;
        --skeleton-tab: #16181c80;
        --skeleton-card: #16181c;
        --skeleton-stroke: #ffffff0f;
        --skeleton-divider: #ffffff12;
        --skeleton-line: #ffffff12;
        --skeleton-shine: #ffffff08;
      }
    }

    .app-skeleton {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .app-skeleton__frame {
      position: absolute;
      left: 50%;
      width: 100%;
      transform: translateX(-50%);
      box-sizing: border-box;
    }

    .app-skeleton__nav {
      top: 0;
      height: calc(56px + env(safe-area-inset-top));
      background: var(--nav-bar-color, var(--skeleton-nav));
      border-bottom: 1px solid var(--divider-color, var(--skeleton-divider));
    }

    .app-skeleton__tab {
      bottom: 0;
      height: calc(59px + env(safe-area-inset-bottom));
      background: var(--tab-bar-color, var(--skeleton-tab));
    }

    .app-skeleton > .app-skeleton__list {
      top: calc(56px + env(safe-area-inset-top));
    }

    @media (min-width: 600px) {
      .app-skeleton__frame { max-width: 85%; }
    }

    @media (min-width: 768px) {
      .app-skeleton__frame { max-width: 630px; }
      .app-skeleton__tab { display: none; }
    }

    @media (min-width: 900px) {
      .app-skeleton__frame { max-width: 700px; }
    }

    @media (min-width: 1200px) {
      .app-skeleton__frame { max-width: 900px; }
    }

    .app-skeleton__list {
      padding: 0 12px;
      box-sizing: border-box;
    }

    .app-skeleton__chips {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 51px;
      padding-left: 4px;
    }

    .app-skeleton__chips i,
    .app-skeleton__title {
      display: block;
      height: 12px;
      border-radius: 6px;
      background: var(--skeleton-line);
    }

    .app-skeleton__chips i:first-child { width: 28px; }
    .app-skeleton__chips i:last-child { width: 52px; }

    .app-skeleton__title {
      width: 104px;
      height: 14px;
      margin: 5px 0 17px;
      border-radius: 7px;
    }

    .app-skeleton__card {
      position: relative;
      height: 67px;
      margin-bottom: 12px;
      box-sizing: border-box;
      border-radius: var(--item-card-radios, 16px);
      border: 1px solid var(--stroke, var(--skeleton-stroke));
      background-color: var(--card-color, var(--skeleton-card));
      background-image: linear-gradient(100deg, transparent 30%, var(--skeleton-shine) 50%, transparent 70%);
      background-size: 220% 100%;
      animation: app-skeleton-shine 1.6s ease-in-out infinite;
    }

    .app-skeleton__card::before,
    .app-skeleton__card::after {
      content: "";
      position: absolute;
      top: 50%;
      background: var(--skeleton-line);
    }

    .app-skeleton__card::before {
      left: 14px;
      width: 36px;
      height: 36px;
      margin-top: -18px;
      border-radius: 10px;
    }

    .app-skeleton__card::after {
      left: 62px;
      width: 96px;
      height: 12px;
      margin-top: -13px;
      border-radius: 6px;
      box-shadow: 0 20px 0 -2px var(--skeleton-line);
    }

    @keyframes app-skeleton-shine {
      from { background-position: 120% 0; }
      to { background-position: -20% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-skeleton__card { animation: none; }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="app-skeleton" aria-hidden="true">
      <div class="app-skeleton__frame app-skeleton__nav"></div>
      <div class="app-skeleton__frame app-skeleton__list">
        <div class="app-skeleton__chips"><i></i><i></i></div>
        <i class="app-skeleton__title"></i>
        <div class="app-skeleton__card"></div>
        <div class="app-skeleton__card"></div>
        <div class="app-skeleton__card"></div>
        <div class="app-skeleton__card"></div>
      </div>
      <div class="app-skeleton__frame app-skeleton__tab"></div>
    </div>
  </div>
  <div style='z-index:9999;position: relative' id='ztop'></div>
  <script type="module" async src="/src/splash.ts"></script>
  <noscript>
    <strong>We're sorry but Sub-Store doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong>
  </noscript>
</body>

</html>
