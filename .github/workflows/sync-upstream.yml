name: sync upstream

# Merges sub-store-org/Sub-Store-Front-End master into this repository every
# day and starts a release when anything new came in. Files this repository
# owns keep our version. When the merge still conflicts or fails validation,
# upstream master is pushed to the upstream-sync branch and a pull request is
# opened from it; the run fails so the owner gets notified. (This repository
# is no longer a GitHub fork, so a pull request cannot come straight from the
# upstream repository.)
on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: sub-store-org/Sub-Store-Front-End
  # Upstream edits to these are dropped in favour of this fork's version,
  # including files this fork deleted because it does not use them.
  FORK_OWNED_FILES: >-
    README.md
    NOTICE
    .editorconfig
    .gitattributes
    .github/workflows/main.yml
    .github/workflows/update-vercel-project-settings.yml
    .github/ISSUE_TEMPLATE/功能建议.yml
    .github/ISSUE_TEMPLATE/问题反馈.yml
    .husky/commit-msg
    vercel.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      # Needed to rebuild pnpm-lock.yaml when upstream changes dependencies.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Merge upstream master
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream master
          upstream_sha="$(git rev-parse --short upstream/master)"
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already contains upstream ${upstream_sha}."
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-commit --no-ff upstream/master || true
          for file in $FORK_OWNED_FILES; do
            if git cat-file -e "HEAD:${file}" 2>/dev/null; then
              git checkout HEAD -- "$file"
            else
              git rm --quiet --force --ignore-unmatch -- "$file"
            fi
          done
          # This fork overrides some dependency versions (pnpm-workspace.yaml),
          # so its lockfile differs from upstream's and every upstream
          # dependency change would conflict. Start from upstream's lockfile
          # and let pnpm re-apply the overrides instead.
          unmerged="$(git diff --name-only --diff-filter=U)"
          if ! grep -qxE 'package\.json|pnpm-workspace\.yaml' <<<"$unmerged" \
            && ! git diff --cached --quiet HEAD -- package.json pnpm-workspace.yaml pnpm-lock.yaml; then
            git checkout MERGE_HEAD -- pnpm-lock.yaml
            corepack enable
            pnpm install --lockfile-only --ignore-scripts
            git add pnpm-lock.yaml
          fi
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$conflicts" ]]; then
            {
              echo "### 上游合并冲突"
              echo
              echo "$conflicts" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! (
            corepack enable &&
            pnpm install --frozen-lockfile &&
            npm ci --prefix auth-gateway --ignore-scripts &&
            node --check auth-gateway/server.mjs &&
            pnpm check:gateway &&
            bash -n scripts/deploy.sh &&
            bash scripts/check-deploy.sh &&
            node scripts/check-release.mjs &&
            pnpm check:locales &&
            pnpm build
          ); then
            git merge --abort
            echo "result=validation-failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --no-edit -m "chore: merge upstream ${upstream_sha}"
          if git push origin HEAD:master; then
            echo "Merged upstream ${upstream_sha}." >> "$GITHUB_STEP_SUMMARY"
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            echo "推送被拒绝（上游修改了工作流文件时需要带 workflow 权限的 SYNC_TOKEN）。" >> "$GITHUB_STEP_SUMMARY"
            echo "result=push-rejected" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the default token do not trigger other workflows, so
      # the release has to be started explicitly.
      - name: Start release
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          if [[ "$HAS_SYNC_TOKEN" == false ]]; then
            gh workflow run main.yml --ref master
          fi

      - name: Open pull request from upstream
        if: steps.merge.outputs.result == 'conflict' || steps.merge.outputs.result == 'push-rejected' || steps.merge.outputs.result == 'validation-failed'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.merge.outputs.result }}
        run: |
          upstream_sha="$(git rev-parse --short upstream/master)"
          # The default token cannot push commits that change workflow files,
          # so this push fails in the same cases as a push-rejected merge.
          if ! git push --force origin "refs/remotes/upstream/master:refs/heads/upstream-sync"; then
            body="$(cat <<EOT
          每日同步无法合并上游 ${UPSTREAM_REPOSITORY} 的 master（${RESULT}，${upstream_sha}），而且上游修改了工作流文件，默认令牌推不了 upstream-sync 分支。

          手动处理：

          \`\`\`bash
          git fetch https://github.com/${UPSTREAM_REPOSITORY}.git master
          git merge FETCH_HEAD
          \`\`\`

          解决冲突后推送到 master，然后关闭这个 Issue。想让这种情况自动处理，可以添加带 workflow 权限的 SYNC_TOKEN 密钥。

          运行记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOT
          )"
            issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title 同步上游需要手动处理' --json number --jq '.[0].number // empty')"
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "同步上游需要手动处理" --body "$body"
            fi
            echo "需要手动合并上游，见 Issue。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base master --head upstream-sync --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head upstream-sync \
              --title "同步上游更新" \
              --body "自动同步未能直接合并上游 ${UPSTREAM_REPOSITORY} 的 master（${RESULT}，${upstream_sha}），请在此处理后合并。"
          fi
          echo "需要手动处理上游同步，见 Pull Request。" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, and upstream can stay quiet for months. Re-enabling this
      # workflow on every run resets that timer so syncing never stops silently.
      - name: Keep the schedule alive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/sync-upstream.yml/enable"
