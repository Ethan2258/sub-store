name: sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/sub-store-org/Sub-Store-Front-End.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date."
            exit 0
          fi
          if ! git merge upstream/master --no-edit; then
            git merge --abort
            echo "Upstream has conflicts with the liquid-glass theme. Merge it by hand."
            exit 1
          fi
          git push origin HEAD:master
