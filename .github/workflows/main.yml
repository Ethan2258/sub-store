name: release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    # Every change to master is released; only files that never reach the
    # built site are skipped.
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
      - ".github/workflows/sync-upstream.yml"
      - ".vscode/**"
  # Pull requests only build, so a broken change shows up before it is merged.
  pull_request:
    branches:
      - master

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  # Pull requests only need their latest build. Releases queue up instead,
  # so a quick second push cannot cancel the first one half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check gateway and deployment
        run: |
          npm ci --prefix auth-gateway --ignore-scripts
          node --check auth-gateway/server.mjs
          pnpm check:gateway
          bash -n scripts/deploy.sh
          bash scripts/check-deploy.sh
          node scripts/check-release.mjs

      - name: Check translations
        run: pnpm check:locales

      - name: Release tag
        id: tag
        run: |
          version="$(node --eval='process.stdout.write(require("./package.json").version)')"
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            build_tag="${version}-pr${{ github.event.pull_request.number }}"
          else
            build_tag="${version}-${GITHUB_RUN_NUMBER}"
          fi
          echo "release_tag=${build_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "SUB_STORE_BUILD_TAG=${build_tag}" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Zip
        if: github.event_name != 'pull_request'
        run: |
          cp LICENSE NOTICE dist/
          cp LICENSE NOTICE auth-gateway/
          zip -qr dist.zip dist
          zip -qr auth-gateway.zip auth-gateway -x 'auth-gateway/node_modules/*'
          unzip -p auth-gateway.zip auth-gateway/public/webauthn-browser.LICENSE.txt | grep 'Permission is hereby granted' > /dev/null
          unzip -p dist.zip dist/LICENSE | grep 'GNU GENERAL PUBLIC LICENSE' > /dev/null
          sha256sum dist.zip > dist.zip.sha256
          sha256sum auth-gateway.zip > auth-gateway.zip.sha256

      - name: Release notes
        if: github.event_name != 'pull_request'
        run: |
          previous="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "Sub-Store 前端 ${{ steps.tag.outputs.version }}"
            echo
            echo "默认主题是黑、白、灰的液态玻璃。压缩包里的 \`dist\` 可以直接作为前端静态文件，\`auth-gateway.zip\` 是配套的登录网关。"
            echo
            echo "### 本次改动"
            echo
            if [[ -n "$previous" ]]; then
              git log --no-merges --format='- %s (%h)' "${previous}..HEAD"
              echo
              echo "完整对比：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${{ steps.tag.outputs.release_tag }}"
            else
              git log --no-merges -n 20 --format='- %s (%h)'
            fi
            echo
            echo "### 许可证"
            echo
            echo "GPL-3.0，基于 [sub-store-org/Sub-Store-Front-End](https://github.com/sub-store-org/Sub-Store-Front-End) 修改。两个压缩包里都附带 \`LICENSE\` 和 \`NOTICE\`，这一版的源代码：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${{ steps.tag.outputs.release_tag }}"
          } > release-notes.md

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          # Tag the commit that was built, not whatever master points at when
          # the release is published.
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.release_tag }}
          body_path: release-notes.md
          files: |
            dist.zip
            dist.zip.sha256
            auth-gateway.zip
            auth-gateway.zip.sha256
          make_latest: true
