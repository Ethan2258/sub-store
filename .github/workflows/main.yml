name: release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "package.json"
      - "src/**"
      - "index.html"
      - "pnpm-lock.yaml"
      - ".github/workflows/main.yml"
  # Pull requests only build, so a broken change shows up before it is merged.
  pull_request:
    branches:
      - master

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Zip
        if: github.event_name != 'pull_request'
        run: zip -r dist.zip dist

      - name: Release tag
        if: github.event_name != 'pull_request'
        id: tag
        run: |
          version="$(node --eval='process.stdout.write(require("./package.json").version)')"
          echo "release_tag=${version}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          body: |
            Sub-Store 前端 ${{ steps.tag.outputs.version }}

            默认主题是黑、白、灰的液态玻璃。压缩包里的 `dist` 可以直接作为前端静态文件。
          files: dist.zip
          make_latest: true
